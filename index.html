<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroSmart Lab - LKPD Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; }
        .module-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .hidden-section { display: none; }
        .active-tab { border-bottom: 4px solid #16a34a; font-weight: bold; color: #16a34a; }
        .inactive-tab { color: #6b7280; border-bottom: 4px solid transparent; }
    </style>
</head>
<body class="p-4 md:p-8 text-gray-800">

    <div class="max-w-2xl mx-auto">
        
        <!-- Header -->
        <div class="text-center mb-6 bg-green-600 text-white p-6 rounded-xl shadow-lg">
            <h1 class="text-2xl md:text-3xl font-bold">🌱 AgroSmart Lab</h1>
            <p class="text-sm mt-2">Portal Laporan Praktikum Terpadu SMK Agribisnis Ternak</p>
        </div>

        <!-- NAVIGASI TABS -->
        <div class="flex justify-center bg-white rounded-t-xl mb-4 shadow-sm border-b">
            <button id="tab-form" onclick="switchTab('form')" class="w-1/2 py-3 text-center active-tab cursor-pointer hover:bg-gray-50 transition">
                📝 Isi Laporan
            </button>
            <button id="tab-rekap" onclick="switchTab('rekap')" class="w-1/2 py-3 text-center inactive-tab cursor-pointer hover:bg-gray-50 transition">
                📊 Lihat Rekap Data
            </button>
        </div>

        <!-- ======================= BAGIAN FORM ======================= -->
        <div id="section-form">
            <form id="form-evaluasi">
                <!-- Identitas (Diringkas agar kode tak terlalu panjang di contoh, Anda bisa tambah sesuai yang lama) -->
                <div class="module-card border-t-4 border-green-600">
                    <h2 class="text-xl font-bold mb-4">📝 Identitas Kelompok</h2>
                    
                    <label class="block text-sm font-semibold mb-1">Kelas:</label>
                    <select id="input-kelas" class="w-full p-3 border rounded-lg mb-4 bg-gray-50" required>
                    <option value="">-- Pilih Kelas --</option>
                    <option value="X AT 1">X AT 1</option>
                    <option value="X AT 2">X AT 2</option>
                    <option value="X AT 3">X AT 3</option>
                </select>

                <label class="block text-sm font-semibold mb-1">Kelompok:</label>
                <select id="input-kelompok" class="w-full p-3 border rounded-lg mb-4 bg-gray-50" required>
                    <option value="">-- Pilih Kelompok --</option>
                    <option value="Kelompok 1">Kelompok 1</option>
                    <option value="Kelompok 2">Kelompok 2</option>
                    <option value="Kelompok 3">Kelompok 3</option>
                    <option value="Kelompok 4">Kelompok 4</option>
                    <option value="Kelompok 5">Kelompok 5</option>
                    <option value="Kelompok 6">Kelompok 6</option>
                    <option value="Kelompok 7">Kelompok 7</option>
                    <option value="Kelompok 8">Kelompok 8</option>
                    <option value="Kelompok 9">Kelompok 9</option>
                    <option value="Kelompok 10">Kelompok 10</option>
                    <option value="Kelompok 11">Kelompok 11</option>
                    <option value="Kelompok 12">Kelompok 12</option>
                    <option value="Kelompok 13">Kelompok 13</option>
                    <option value="Kelompok 14">Kelompok 14</option>
                    <option value="Kelompok 15">Kelompok 15</option>
                </select>

                    <label class="block text-sm font-semibold mb-1">Anggota Hadir:</label>
                    <textarea id="input-anggota" class="w-full p-3 border rounded-lg bg-gray-50" required></textarea>
                </div>

                <!-- Modul Singkat (Tambahkan modul 1,2,3 seperti kode HTML Anda sebelumnya di sini) -->
                <div class="module-card border-t-4 border-orange-600">
                    <h2 class="text-xl font-bold mb-4">🔥 Uji Briket</h2>
                    <label class="block text-sm font-semibold mb-1">Lama Menyala (Menit):</label>
                    <input type="number" id="m3-nyala" class="w-full p-3 border rounded-lg mb-4 bg-gray-50" required>
                    
                    <label class="block text-sm font-semibold mb-1">Tingkat Asap:</label>
                    <select id="m3-asap" class="w-full p-3 border rounded-lg mb-4 bg-gray-50" required>
                        <option value="Sangat Berasap">Sangat Berasap</option>
                        <option value="Sedikit Asap">Sedikit Asap</option>
                        <option value="Tanpa Asap">Tanpa Asap</option>
                    </select>

                    <label class="block text-sm font-semibold mb-1">Foto Bukti:</label>
                    <input type="file" id="input-foto" accept="image/*" class="w-full mt-2">
                </div>

                <button type="submit" id="btn-submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg transition mb-10 text-lg">
                    🚀 Kirim Laporan
                </button>
            </form>
        </div>

        <!-- ======================= BAGIAN REKAP ======================= -->
        <div id="section-rekap" class="hidden-section">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-700">Rekap Laporan Masuk</h2>
                <button onclick="loadRekap()" class="bg-blue-100 text-blue-700 px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-blue-200">
                    🔄 Refresh
                </button>
            </div>
            
            <!-- Tempat data ditampilkan -->
            <div id="container-rekap">
                <p class="text-center text-gray-500 py-10">Klik refresh untuk memuat data...</p>
            </div>
        </div>

    </div>

    <!-- SCRIPT LOGIKA PENGIRIMAN & PENGAMBILAN DATA -->
    <script>
        // ------------------------------------------------------------------
        // PENTING: GANTI URL DI BAWAH INI DENGAN URL WEB APP APPS SCRIPT ANDA
        // ------------------------------------------------------------------
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwho1xC42JcN6eWhK5PapMRD9I4pU4HwVUKOQPD5qNOo-cnLkL65LU_p_JuCOePlaWvzQ/exec'; 

        // Fungsi berpindah tab menu
        function switchTab(tab) {
            if(tab === 'form') {
                document.getElementById('section-form').classList.remove('hidden-section');
                document.getElementById('section-rekap').classList.add('hidden-section');
                document.getElementById('tab-form').classList.replace('inactive-tab', 'active-tab');
                document.getElementById('tab-rekap').classList.replace('active-tab', 'inactive-tab');
            } else {
                document.getElementById('section-form').classList.add('hidden-section');
                document.getElementById('section-rekap').classList.remove('hidden-section');
                document.getElementById('tab-form').classList.replace('active-tab', 'inactive-tab');
                document.getElementById('tab-rekap').classList.replace('inactive-tab', 'active-tab');
                // Otomatis load data saat buka tab rekap
                loadRekap();
            }
        }

        // FUNGSI UNTUK MENGAMBIL DATA DARI GOOGLE SHEETS
        async function loadRekap() {
            const container = document.getElementById('container-rekap');
            container.innerHTML = '<p class="text-center text-blue-500 font-bold py-10">⏳ Memuat Data dari Server...</p>';

            try {
                // Fetch method GET (default)
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();
                
                if (data.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-500 py-10">Belum ada laporan yang masuk.</p>';
                    return;
                }

                container.innerHTML = ''; // Bersihkan container

                // Render tiap baris data menjadi kartu (Dibalik agar data terbaru di atas)
                data.reverse().forEach(row => {
                    // Karena kita baca object JSON, key disesuaikan dengan Header kolom Excel Anda.
                    // Pastikan nama header di kode ini sama persis dengan nama Header Excel (Baris 1).
                    // Contoh di Excel: Kolom B bernama 'Kelas', Kolom C 'Kelompok', dst.
                    
                    const kelas = row['Kelas'] || "-";
                    const kelompok = row['Kelompok'] || "-";
                    const nyala = row['M3_Nyala'] || "-";
                    const asap = row['M3_Asap'] || "-";
                    const linkFoto = row['Link_Foto'] || "#";

                    let fotoHtml = linkFoto.includes('http') 
                        ? `<a href="${linkFoto}" target="_blank" class="text-blue-500 underline text-sm">Lihat Foto</a>` 
                        : `<span class="text-gray-400 text-sm">Tidak ada foto</span>`;

                    const cardHtml = `
                        <div class="bg-white rounded-xl shadow p-5 mb-4 border-l-4 border-blue-500">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h3 class="font-bold text-lg text-gray-800">${kelompok}</h3>
                                    <p class="text-xs font-semibold text-gray-500">${kelas}</p>
                                </div>
                                <span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded font-bold">Selesai ✅</span>
                            </div>
                            
                            <div class="mt-3 grid grid-cols-2 gap-2 text-sm text-gray-600 bg-gray-50 p-3 rounded-lg border">
                                <div>
                                    <p class="font-semibold text-xs text-gray-400">Lama Nyala:</p>
                                    <p class="font-bold text-gray-800">🔥 ${nyala} Menit</p>
                                </div>
                                <div>
                                    <p class="font-semibold text-xs text-gray-400">Tingkat Asap:</p>
                                    <p class="font-bold text-gray-800">💨 ${asap}</p>
                                </div>
                            </div>
                            <div class="mt-3 text-right">
                                ${fotoHtml}
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHtml;
                });

            } catch (error) {
                container.innerHTML = '<p class="text-center text-red-500 font-bold py-10">❌ Gagal memuat data. Pastikan URL Script benar.</p>';
                console.error(error);
            }
        }

        // ==============================================================
        // SCRIPT PENGIRIMAN DATA (SAMA SEPERTI SEBELUMNYA)
        // ==============================================================
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    let encoded = reader.result.toString().replace(/^data:(.*,)?/, '');
                    if ((encoded.length % 4) > 0) { encoded += '='.repeat(4 - (encoded.length % 4)); }
                    resolve(encoded);
                };
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('form-evaluasi').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('btn-submit');
            submitBtn.innerHTML = "⏳ Mengirim..."; submitBtn.disabled = true;

            try {
                const fileInput = document.getElementById('input-foto');
                const file = fileInput.files[0];
                let base64Foto = "", tipeFoto = "", namaFoto = "";

                if (file) {
                    base64Foto = await getBase64(file);
                    tipeFoto = file.type;
                    namaFoto = "Foto_" + document.getElementById('input-kelompok').value + "_" + file.name;
                }

                const dataKirim = {
                    kelas: document.getElementById('input-kelas').value,
                    kelompok: document.getElementById('input-kelompok').value,
                    anggota: document.getElementById('input-anggota').value,
                    m3_nyala: document.getElementById('m3-nyala').value,
                    m3_asap: document.getElementById('m3-asap').value,
                    foto_briket_base64: base64Foto,
                    foto_briket_tipe: tipeFoto,
                    foto_briket_nama: namaFoto
                };

                const res = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST', body: JSON.stringify(dataKirim), headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                const result = await res.json();
                if(result.result === "success") {
                    alert("Sukses!"); 
                    // Set form reset dan pindah ke tab rekap
                    document.getElementById('form-evaluasi').reset();
                    switchTab('rekap'); 
                }
            } catch (err) {
                alert("Gagal mengirim data.");
            }
            submitBtn.innerHTML = "🚀 Kirim Laporan"; submitBtn.disabled = false;
        });
    </script>
</body>
</html>
